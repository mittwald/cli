name: Update README for pull requests

# Re-generates README.md and docs/*.md for pull requests from branches of this
# repository and pushes the result to the PR branch. Fork PRs are skipped; their
# authors run `yarn generate:readme` themselves.
#
# Runs on pull_request, so the workflow file comes from the PR branch and anyone
# who can push a branch can read README_APP_*. The README app therefore can't do
# more than they can anyway: contents permissions on this repository only, no
# ruleset bypass, no workflows permission. Unlike pushes with the GITHUB_TOKEN,
# its pushes start CI for the new commit.
#
# Runs triggered by Dependabot itself only get Dependabot secrets, so README_APP_*
# are stored there as well. Only the push job references them; the generate job,
# which runs the bumped dependency's code, gets no secrets.
#
# - "generate" builds the PR and regenerates the docs. It runs the PR's code,
#   so it has no secrets, a read-only token and no persisted git credentials.
#   It hands over the docs changes as a patch.
# - "push" runs no code from the PR. It checks that the patch only touches
#   README.md and docs/*.md, and pushes it with the README app's token.

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - ready_for_review
      - synchronize

permissions:
  contents: read

concurrency:
  group: readme-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Re-generate README
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-tags: "true"
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn
        env:
          YARN_ENABLE_SCRIPTS: "false"
      - run: yarn compile
      - run: yarn generate:readme
      - name: Export docs changes as patch
        run: |
          git add -A README.md docs
          git diff --cached --binary > "$RUNNER_TEMP/readme.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@v7
        with:
          name: readme-patch
          path: ${{ runner.temp }}/readme.patch
          retention-days: 1

  push:
    name: Push README
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Treats the patch as untrusted input. Do not run any code from the PR
    # (no yarn, no npm, no scripts from the checkout) in this job.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: readme-patch
          path: ${{ runner.temp }}/readme

      - name: Check for changes
        id: changes
        run: |
          if [[ -s "$RUNNER_TEMP/readme/readme.patch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "README and docs are up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create app token
        id: app
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.README_APP_CLIENT_ID }}
          private-key: ${{ secrets.README_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}

      - name: Apply and push
        if: steps.changes.outputs.changed == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR:
            ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor
            }}@users.noreply.github.com>
        run: |
          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::notice::The PR branch moved on; the run for the newer commit takes care of the README."
            exit 0
          fi

          git apply --index "$RUNNER_TEMP/readme/readme.patch"

          unexpected=$(git diff --cached --name-only | grep -vE '^(README\.md|docs/[^/]+\.md)$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::The generated patch touches files other than README.md and docs/*.md:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --cached --summary | grep -E 'mode (120000|160000|100755)'; then
            echo "::error::The generated patch contains symlinks, submodules or executable files."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --author="$AUTHOR" -m "chore: re-generate README"
          git push origin "HEAD:refs/heads/$HEAD_REF"
