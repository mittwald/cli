name: Review Dependabot pull request

# Reviews a single Dependabot PR with OpenCode (see opencode.json and the
# review-dependabot-pr skill), then merges or escalates it. Called for every
# eligible PR by review-dependabot-prs.yml, or dispatched manually for one PR.
# This is the only workflow that merges Dependabot PRs.
#
# The work is split in two jobs so that the dependency's code never runs next to
# a write token:
#
# - "review" installs the bumped dependency, runs the checks and the agent. It
#   only has a read-only GITHUB_TOKEN and no persisted git credentials. The
#   agent commits locally and hands over a patch, a comment and a decision as an
#   artifact. Fast-tracked PRs skip this job.
# - "apply" runs no code from the PR. It validates the artifact, pushes the
#   patch, waits for CI, and then merges or escalates using a token of the
#   dependency GitHub App.
#
# The app may bypass the "master" ruleset for pull requests. That skips the
# required review *and* the required status checks, so "apply" waits for the
# checks itself, and only bypasses the review for commits from Dependabot
# (signed by GitHub), commits it pushed itself, and commits that only touch the
# generated docs. Anything else needs a maintainer's approval.

on:
  workflow_call:
    inputs:
      pr:
        description: Number of the Dependabot pull request to review.
        type: number
        required: true
      fast-track:
        description:
          Skip the agent review and merge as soon as the required checks pass.
        type: boolean
        default: false
    # No secrets are passed in: MITTWALD_AI_API_KEY is a secret of the
    # "ai-agents" environment (review job), the dependency app's credentials
    # are secrets of the "dependency-updates" environment (apply job).
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the Dependabot pull request to review.
        type: number
        required: true
      fast-track:
        description:
          Skip the agent review and merge as soon as the required checks pass.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  review:
    name: Review
    if: ${{ !inputs.fast-track }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Holds MITTWALD_AI_API_KEY. Deliberately not "dependency-updates": this
    # job runs the dependency's code and must never see the app's key.
    environment: ai-agents
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    env:
      PR: ${{ inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      # Do not run install scripts of dependencies. Compilation, linting and
      # tests still load the dependency's code, but at least nothing runs on
      # install.
      YARN_ENABLE_SCRIPTS: "false"
    steps:
      # The agent reads opencode.json and its skills from the PR checkout and
      # runs with MITTWALD_AI_API_KEY, so only ever check out Dependabot's PRs.
      - name: Check pull request
        run: |
          read -r author cross <<<"$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json author,isCrossRepository --jq '"\(.author.login) \(.isCrossRepository)"')"
          if [[ "$author" != "app/dependabot" || "$cross" != "false" ]]; then
            echo "::error::#$PR is not a Dependabot pull request from this repository."
            exit 1
          fi

      - name: Prepare output directory
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          echo "REVIEW_OUTPUT_DIR=$RUNNER_TEMP/review" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout PR branch
        id: pr
        run: |
          gh pr checkout "$PR"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Same Node.js version as test.yml, so local checks match CI.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Configure git identity
        run: |
          git config user.name "mittwald-machine[bot]"
          git config user.email "opensource@mittwald.de"

      - name: Review pull request
        env:
          MITTWALD_AI_API_KEY: ${{ secrets.MITTWALD_AI_API_KEY }}
        run: |
          PROMPT=$(cat <<PROMPT_EOF
          Run the review-dependabot-pr skill for pull request #${PR} in
          ${GITHUB_REPOSITORY}. The PR branch is already checked out and its
          dependencies are installed. Write your hand-over files to
          ${REVIEW_OUTPUT_DIR}.

          This is a non-interactive, unattended run: never stop to ask a
          clarifying question. If something is ambiguous, decide to escalate
          and explain why in your comment.
          PROMPT_EOF
          )
          # Only print warnings and errors (e.g. provider errors) of OpenCode's
          # own log; the agent's output and tool calls are printed regardless.
          opencode run --print-logs --log-level WARN --thinking --auto "$PROMPT"

      - name: Export commits as patch
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          if ! git merge-base --is-ancestor "$HEAD_SHA" HEAD; then
            echo "::error::The agent rewrote the PR's existing history."
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::warning::Discarding uncommitted changes:"
            git status --porcelain
          fi
          git format-patch --binary --stdout "$HEAD_SHA..HEAD" > "$REVIEW_OUTPUT_DIR/changes.patch"
          ls -la "$REVIEW_OUTPUT_DIR"

      - name: Upload review result
        uses: actions/upload-artifact@v7
        with:
          name: review-result-${{ inputs.pr }}
          path: |
            ${{ runner.temp }}/review/changes.patch
            ${{ runner.temp }}/review/comment.md
            ${{ runner.temp }}/review/decision
          if-no-files-found: warn
          retention-days: 7

  apply:
    name: Apply
    needs: review
    if:
      ${{ !cancelled() && (needs.review.result == 'success' ||
      (inputs.fast-track && needs.review.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Holds DEPENDENCY_APP_CLIENT_ID and DEPENDENCY_APP_PRIVATE_KEY. Restrict
    # its deployment branches to master, so that workflows on other branches
    # cannot read the app's key.
    environment: dependency-updates
    env:
      PR: ${{ inputs.pr }}
      FAST_TRACK: ${{ inputs.fast-track }}
      REVIEWED_SHA: ${{ needs.review.outputs.head_sha }}
      ESCALATION_LABEL: needs-human-review
      ESCALATION_TEAM: mittwald/developer-relations
    # Everything below treats the review result as untrusted input. Do not run
    # any code from the PR (no yarn, no npm, no scripts from the checkout) in
    # this job. The app token is only passed to the steps that need it.
    steps:
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          permission-members: read

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "RESULT_DIR=$RUNNER_TEMP/review" >> "$GITHUB_ENV"
          echo "NOTES=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          echo "OWN_COMMITS=$RUNNER_TEMP/own-commits" >> "$GITHUB_ENV"
          touch "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/own-commits"

          read -r author cross head <<<"$(gh pr view "$PR" \
            --json author,isCrossRepository,headRefOid \
            --jq '"\(.author.login) \(.isCrossRepository) \(.headRefOid)"')"
          if [[ "$author" != "app/dependabot" || "$cross" != "false" ]]; then
            echo "::error::#$PR is not a Dependabot pull request from this repository."
            exit 1
          fi
          echo "HEAD_SHA=${REVIEWED_SHA:-$head}" >> "$GITHUB_ENV"

      - name: Download review result
        if: ${{ !inputs.fast-track }}
        uses: actions/download-artifact@v8
        with:
          name: review-result-${{ inputs.pr }}
          path: ${{ runner.temp }}/review

      - name: Configure git identity
        run: |
          git config user.name "mittwald-machine[bot]"
          git config user.email "opensource@mittwald.de"

      - name: Validate decision
        id: decision
        run: |
          if [[ "$FAST_TRACK" == true ]]; then
            decision=merge
          else
            decision=$(tr -d '[:space:]' < "$RESULT_DIR/decision" 2>/dev/null || true)
            case "$decision" in
              merge|escalate) ;;
              *)
                echo "- The review did not produce a valid decision." >> "$NOTES"
                decision=escalate
                ;;
            esac
          fi
          echo "Decision: $decision"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Push changes
        id: push
        if: ${{ !inputs.fast-track }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          git fetch origin "refs/heads/$branch"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::PR #$PR changed while it was being reviewed. It will be picked up again on the next run."
            exit 1
          fi
          git checkout --detach "$HEAD_SHA"

          if [[ ! -s "$RESULT_DIR/changes.patch" ]]; then
            echo "No changes to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git am --keep-cr "$RESULT_DIR/changes.patch"

          # Files that can run code in CI or change the agent's own
          # instructions. Changes to these always need a human.
          forbidden=$(git diff --name-only "$HEAD_SHA" HEAD \
            | grep -E '^(\.github/|\.yarn/|\.yarnrc\.yml$|\.agents/|opencode\.json$)' || true)
          if [[ -n "$forbidden" ]]; then
            {
              echo "- The review produced changes to protected files, so they were **not pushed**:"
              sed 's/^/  - `/; s/$/`/' <<<"$forbidden"
            } >> "$NOTES"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "forbidden=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The merge step accepts these commits without a human review.
          git rev-list "$HEAD_SHA..HEAD" > "$OWN_COMMITS"
          git log --oneline "$HEAD_SHA..HEAD"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$branch"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and merge
        id: merge
        if:
          steps.decision.outputs.decision == 'merge' &&
          steps.push.outputs.forbidden != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          # Bypassing the required review is only fine for commits that need
          # no review: Dependabot's own (signed by GitHub), the ones this job
          # pushed, and commits that only touch README.md and docs/*.md (the
          # README job). Anything else, e.g. a commit someone pushed onto the
          # Dependabot branch, needs a maintainer's approval.
          provenance_ok() {
            local sha=$1 base commit files
            # Called as a condition, so "set -e" does not apply in here.
            git fetch --quiet origin "$sha" "+refs/heads/master:refs/remotes/origin/master" || return 1
            base=$(git merge-base origin/master "$sha") || return 1
            if [[ -n "$(git rev-list --merges "$base..$sha")" ]]; then
              echo "- The PR contains merge commits and needs a maintainer's approval, so it was not merged." >> "$NOTES"
              return 1
            fi
            for commit in $(git rev-list "$base..$sha"); do
              if grep -qxF "$commit" "$OWN_COMMITS"; then
                continue
              fi
              files=$(git diff-tree --no-commit-id --name-only -r "$commit")
              if [[ -n "$files" ]] \
                && ! grep -qvE '^(README\.md|docs/[^/]+\.md)$' <<<"$files" \
                && ! git diff-tree -r --summary "$commit" | grep -qE '(120000|160000|100755)'; then
                continue
              fi
              if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" \
                --jq '"\(.author.login) \(.commit.verification.verified)"')" == "dependabot[bot] true" ]]; then
                continue
              fi
              echo "- Commit $commit does not come from Dependabot or this workflow and needs a maintainer's approval, so the PR was not merged." >> "$NOTES"
              return 1
            done
          }

          merged=false
          retry=false
          # Never merge over a review that requested changes, whatever the
          # agent decided.
          if [[ "$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)" == CHANGES_REQUESTED ]]; then
            echo "- A review requested changes, so the PR was not merged." >> "$NOTES"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PUSHED" == true ]]; then
            # Give CI (and the README job, which may push another commit) time
            # to register their checks on the new head.
            sleep 60
          fi
          for attempt in 1 2 3; do
            sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            if [[ "$(gh pr view "$PR" --json reviewDecision --jq .reviewDecision)" == APPROVED ]]; then
              # A maintainer approved; the ruleset is satisfied without the
              # bypass, and GitHub checks that the approval is still valid.
              admin=()
            elif provenance_ok "$sha"; then
              admin=(--admin)
            else
              break
            fi
            # The bypass also skips the required status checks, so wait for
            # them here.
            if ! gh pr checks "$PR" --required --watch --fail-fast --interval 30; then
              echo "- Required checks failed on $sha, so the PR was not merged." >> "$NOTES"
              break
            fi
            if [[ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" != "$sha" ]]; then
              echo "Head moved while waiting for checks, waiting again."
              sleep 30
              continue
            fi
            if gh pr merge "$PR" --squash "${admin[@]}" --match-head-commit "$sha"; then
              merged=true
            else
              echo "- Merging $sha failed." >> "$NOTES"
              retry=true
            fi
            break
          done
          if [[ "$merged" != true && ! -s "$NOTES" ]]; then
            echo "- The PR head kept changing while waiting for checks." >> "$NOTES"
            retry=true
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          # Fast-tracked PRs that merely could not be merged yet (conflicts
          # while Dependabot rebases, a moving head) are retried on the next
          # run instead of being escalated.
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      # Fast-tracked PRs only get a comment when they are escalated.
      - name: Prepare comment
        if:
          ${{ !(inputs.fast-track && (steps.merge.outputs.merged == 'true' ||
          steps.merge.outputs.retry == 'true')) }}
        env:
          MERGED: ${{ steps.merge.outputs.merged == 'true' }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: |
          review="$RUNNER_TEMP/review-comment.md"
          if [[ "$FAST_TRACK" == true ]]; then
            echo "This update was fast-tracked (patch update, \`@mittwald/api-client\` or minor update of a development dependency), so no automated review ran." > "$review"
          elif [[ -s "$RESULT_DIR/comment.md" ]]; then
            head -c 60000 "$RESULT_DIR/comment.md" > "$review"
            # GitHub renders single line breaks, but models tend to hard-wrap
            # Markdown anyway. Join wrapped lines of paragraphs and list items.
            # Runs outside the checkout without config, so that no repository
            # config or plugin is loaded.
            if (cd "$RUNNER_TEMP" && npx --yes prettier@3.9.10 --no-config --no-editorconfig \
              --parser markdown --prose-wrap never < "$review" > "$review.unwrapped"); then
              mv "$review.unwrapped" "$review"
            else
              echo "::warning::Could not unwrap the review comment; posting it as is."
            fi
          fi

          body="$RUNNER_TEMP/comment.md"
          {
            echo "<!-- review-dependabot-pr -->"
            echo "## 🤖 Automated dependency review"
            echo
            if [[ "$MERGED" == true ]]; then
              echo "**Decision:** Merged"
            else
              echo "**Decision:** Escalated to @$ESCALATION_TEAM"
            fi
            if [[ -s "$NOTES" ]]; then
              echo
              echo "### Notes from the workflow"
              echo
              cat "$NOTES"
            fi
            echo
            if [[ -s "$review" ]]; then
              cat "$review"
            else
              echo "The review did not produce a summary. See the workflow run for details."
            fi
            echo
            echo
            echo "<sub>[Workflow run]($RUN_URL)</sub>"
          } > "$body"

      - name: Comment
        if:
          ${{ !(inputs.fast-track && (steps.merge.outputs.merged == 'true' ||
          steps.merge.outputs.retry == 'true')) }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # GraphQL reports bot logins without the "[bot]" suffix.
          ME: ${{ steps.app.outputs.app-slug }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          # If the latest comment or review on the PR is this workflow's own
          # comment, update it instead of adding another one. As soon as anyone
          # else (a human, Dependabot) has commented or reviewed since, post a
          # new comment so the conversation stays in order.
          previous=$(gh pr view "$PR" --json comments,reviews | jq -r --arg me "$ME" '
            [(.comments[] | {at: .createdAt, login: .author.login, url: .url, body: .body}),
             (.reviews[] | {at: .submittedAt, login: .author.login, url: "", body: .body})]
            | sort_by(.at) | last
            | select(. != null and .login == $me and (.body | startswith("<!-- review-dependabot-pr -->")))
            | .url')
          if [[ "$previous" == *"#issuecomment-"* ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/${previous##*#issuecomment-}" \
              --input <(jq -n --rawfile body "$body" '{body: $body}') > /dev/null
            echo "Updated $previous"
          else
            gh pr comment "$PR" --body-file "$body"
          fi

      - name: Escalate
        if:
          ${{ steps.merge.outputs.merged != 'true' && !(inputs.fast-track &&
          steps.merge.outputs.retry == 'true') }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh label create "$ESCALATION_LABEL" --force \
            --color d93f0b --description "Automated review escalated this PR to a human"
          # The label keeps the scheduled run from reviewing the PR again, so set
          # it on its own; the review request must not be able to prevent that.
          gh pr edit "$PR" --add-label "$ESCALATION_LABEL"
          if ! gh pr edit "$PR" --add-reviewer "$ESCALATION_TEAM"; then
            echo "::warning::Could not request a review from $ESCALATION_TEAM (the team needs access to this repository)."
          fi
