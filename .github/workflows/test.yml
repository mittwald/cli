name: Compilation & Unit Tests
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    name: Compile TypeScript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: yarn
      - run: yarn compile

  # This is necessary because we also advertise "npm install -g" as an installation
  # method. Even though we're using yarn ourselves, npm must be able to resolve
  # this package to an installable set of dependencies.
  npm-resolvable:
    strategy:
      matrix:
        node_version: [22, 24]
    runs-on: ubuntu-latest
    name: Test if dependencies are resolvable without errors
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
      - run: npm install

  licenses:
    runs-on: ubuntu-latest
    name: Check license compatibility
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn
      - run: yarn test:licenses

  lint:
    runs-on: ubuntu-latest
    name: Run linters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn
      - run: yarn test:format

  tests:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn
      - run: yarn test:unit

  readme:
    name: Assert README.md is up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: "true"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn
      - run: yarn compile
      - run: yarn test:readme

  docker:
    name: Build and run docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: yarn
      - run: yarn compile
      - run: npx oclif pack tarballs --targets=linux-x64
      - run: docker build --build-arg PKG_SOURCE=dist -t mittwald/cli:testing .
      - run: docker run --rm mittwald/cli:testing --help
      - name: Check ssh tooling in docker image
        run: |
          docker run --rm --entrypoint sh mittwald/cli:testing -ec '
            for binary in ssh scp ssh-keygen rsync; do command -v "$binary"; done
            ssh -G example.invalid | grep -qx "gatewayports yes"
          '
      - name: Check that MW_UID/MW_GID switch the user
        run: |
          container=$(docker run -d -it -e MW_UID=1234 -e MW_GID=2345 mittwald/cli:testing login token)
          trap 'docker logs "$container"; docker rm -f "$container" > /dev/null' EXIT
          for attempt in $(seq 1 20); do
            owner=$(docker exec "$container" stat -c %u:%g /proc/1)
            [ "$owner" = "1234:2345" ] && break
            sleep 0.5
          done
          echo "mw runs as $owner"
          [ "$owner" = "1234:2345" ]
