name: Review Dependabot pull requests

# The only workflow that merges Dependabot PRs. Periodically picks up open
# Dependabot PRs and hands each of them to review-dependabot-pr.yml:
#
# - Patch updates, the "mittwald-api" group (@mittwald/api-client) and minor
#   updates of development dependencies are fast-tracked: they are merged as
#   soon as the required checks pass, without an agent review.
# - All other minor and major updates are reviewed by the agent first.
#
# Dependabot holds back new versions for a cooldown period (see
# .github/dependabot.yml), so fast-tracked versions have been public for a while
# before they get here. To handle a single PR, dispatch review-dependabot-pr.yml
# directly.

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 06:00 UTC.
    - cron: "0 6 * * 1-5"

# Upper bound for the GITHUB_TOKEN of the called workflow; it never needs write
# access (writes go through the dependency app's token in a job that runs no PR
# code).
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read

concurrency:
  group: review-dependabot-prs
  cancel-in-progress: false

jobs:
  select:
    name: Select pull requests
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'mittwald/cli' }}
    outputs:
      merge: ${{ steps.select.outputs.merge }}
      review: ${{ steps.select.outputs.review }}
    steps:
      - name: Select pull requests
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          ESCALATION_LABEL: needs-human-review
        run: |
          # Give CI and the README job time to finish on fresh PRs.
          cutoff=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)

          candidates=$(gh pr list --repo "$GITHUB_REPOSITORY" --author app/dependabot \
            --state open --limit 100 --json number,createdAt,labels \
            --jq "[.[]
              | select(.createdAt < \"$cutoff\")
              | select(all(.labels[]; .name != \"$ESCALATION_LABEL\"))
              | .number] | .[]")

          merge=()
          review=()
          for pr in $candidates; do
            # Dependabot's first commit carries the update metadata as YAML
            # between "---" and "..." (the same data dependabot/fetch-metadata
            # reads). review-dependabot-pr.yml checks that the commits really
            # come from Dependabot before it merges anything.
            deps=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits[0].messageBody' \
              | sed -n '/^---$/,/^\.\.\.$/p' | sed '1d;$d' \
              | yq -o=json '.["updated-dependencies"] // []') || deps='[]'
            if jq -e 'length > 0 and all(.[];
                .["update-type"] == "version-update:semver-patch"
                or .["dependency-group"] == "mittwald-api"
                or (.["dependency-type"] == "direct:development"
                    and .["update-type"] == "version-update:semver-minor"))' <<<"$deps" > /dev/null; then
              merge+=("$pr")
            elif jq -e 'any(.[]; (.["update-type"] // "") | test("semver-(major|minor)$"))' <<<"$deps" > /dev/null; then
              review+=("$pr")
            fi
          done

          to_json() { printf '%s\n' "$@" | jq -cRn '[inputs | select(length > 0) | tonumber]'; }
          echo "Fast-tracked PRs: $(to_json "${merge[@]}")"
          echo "PRs to review: $(to_json "${review[@]}")"
          echo "merge=$(to_json "${merge[@]}")" >> "$GITHUB_OUTPUT"
          echo "review=$(to_json "${review[@]}")" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge PR #${{ matrix.pr }}
    needs: select
    if: ${{ needs.select.outputs.merge != '[]' }}
    strategy:
      fail-fast: false
      # One at a time: every merge changes master, and Dependabot rebases the
      # remaining PRs.
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.merge) }}
    uses: ./.github/workflows/review-dependabot-pr.yml
    with:
      pr: ${{ matrix.pr }}
      fast-track: true

  review:
    name: Review PR #${{ matrix.pr }}
    needs: select
    if: ${{ needs.select.outputs.review != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.review) }}
    uses: ./.github/workflows/review-dependabot-pr.yml
    with:
      pr: ${{ matrix.pr }}
