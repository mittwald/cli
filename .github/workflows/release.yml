name: Create release

on:
  push:
    tags:
      - v*

# Each job declares the permissions it needs. Several jobs run `yarn` with
# install scripts enabled, so none of them should hold write or OIDC
# permissions they don't use.
permissions: {}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies for Windows builds
        run: sudo apt-get install -y p7zip-full nsis

      - name: Install dependencies
        run: yarn

      - name: Set version in package json
        run:
          npm version ${GITHUB_REF#refs/tags/} --no-git-tag-version
          --no-workspaces-update

      - name: Build
        run: yarn compile

      - name: Build all possible packages
        run: yarn package:tarballs

      - name: Upload to S3
        run:
          yarn oclif upload tarballs
          --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64
        env:
          AWS_REGION: eu-central-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Save artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pkg-tarballs
          path: |
            dist/*.tar.gz
            dist/*.tar.xz

  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies for Windows builds
        run: sudo apt-get install -y p7zip-full nsis

      - name: Install dependencies
        run: yarn

      - name: Set version in package json
        run:
          npm version ${GITHUB_REF#refs/tags/} --no-git-tag-version
          --no-workspaces-update

      - name: Build
        run: yarn compile

      - name: Build all possible packages
        run: yarn package:windows

      - name: Upload to S3
        run: yarn oclif upload win --targets=win32-x64,win32-x86
        env:
          AWS_REGION: eu-central-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Save artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pkg-windows
          path: dist/win32/*.exe

  release-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (and provenance) authenticates with an OIDC
      # token from this workflow.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn

      - name: Set version in package json
        run:
          npm version ${GITHUB_REF#refs/tags/} --no-git-tag-version
          --no-workspaces-update

      - name: Build
        run: yarn compile

      - name: Publish
        run: |
          npm publish --access=public --tag=latest

  release-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # gh release create --discussion-category opens an announcement
      # discussion.
      discussions: write
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2

      - name: Create release
        run:
          gh release create ${GITHUB_REF#refs/tags/} --title
          ${GITHUB_REF#refs/tags/} --generate-notes --verify-tag
          --discussion-category Announcements pkg-tarballs/*.tar.gz
          pkg-windows/*.exe
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-s3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - build-linux
      - build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2

      - name: Install dependencies
        run: yarn

      - name: Set version in package json
        run:
          npm version ${GITHUB_REF#refs/tags/} --no-git-tag-version
          --no-workspaces-update

      - name: Upload to S3
        run:
          yarn oclif promote --version=${GITHUB_REF_NAME#v} --sha=$(git
          rev-parse --short ${{ github.sha }}) --win
          --targets=linux-x64,linux-arm64,darwin-x64,darwin-arm64
        env:
          AWS_REGION: eu-central-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  release-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: pkg-tarballs
          path: ./pkg-tarballs

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: mittwald/cli

      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-homebrew:
    runs-on: ubuntu-latest
    # Only for checking out this repository; pushing to mittwald/homebrew-cli
    # uses the GitHub App token created below.
    permissions:
      contents: read
    needs:
      - build-linux
    # Holds RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create app token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-cli
          permission-contents: write

      - name: Checkout Homebrew repo
        uses: actions/checkout@v7.0.1
        with:
          repository: mittwald/homebrew-cli
          path: homebrew
          token: ${{ steps.app.outputs.token }}

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: pkg-tarballs
          path: ./pkg-tarballs

      - name: Generate Homebrew formula
        run: |
          ls -al pkg-tarballs
          sed \
            -e 's/__VERSION__/'${GITHUB_REF_NAME#v}'/g' \
            -e 's/__VERSIONHASH__/'$(git rev-parse --short ${{ github.sha }})'/g' \
            -e 's/__SHA_X64__/'$(sha256sum pkg-tarballs/mw-*-darwin-x64.tar.xz | cut -d" " -f1)'/' \
            -e 's/__SHA_ARM64__/'$(sha256sum pkg-tarballs/mw-*-darwin-arm64.tar.xz | cut -d" " -f1)'/' < scripts/release/homebrew.rb > homebrew/mw.rb

      # Pushes with the app token that the Homebrew checkout persisted.
      - name: Commit and push
        run: |
          cd homebrew
          git config --global user.email "opensource@mittwald.de"
          git config --global user.name "mittwald machine"
          git add mw.rb
          git commit -m "Release ${GITHUB_REF_NAME}"
          git push

  announce-discord:
    needs:
      - release-github
    # Caps the permissions of the called workflow's jobs; its announce job
    # needs contents: read to check out the history it summarizes.
    permissions:
      contents: read
    uses: ./.github/workflows/release-announcement.yml
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  cleanup-artifacts:
    runs-on: ubuntu-latest
    # delete-artifact lists and deletes this run's artifacts with the Actions
    # runtime token, not the GITHUB_TOKEN, so it needs no permissions.
    permissions: {}
    needs:
      - release-github
      - release-docker
      - release-homebrew
    steps:
      - uses: geekyeggo/delete-artifact@v6.0.0
        with:
          name: |
            pkg-*
